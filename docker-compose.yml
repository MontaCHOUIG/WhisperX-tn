services:
  asr-backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/models/whisper-tn-ct2
      - DEVICE=cuda
      - COMPUTE_TYPE=float16
      - LANGUAGE=ar
      - MAX_CONCURRENT_GPU_JOBS=1
      - SYNC_MAX_AUDIO_SECONDS=60
      - API_KEY=${API_KEY:-}
      - ENABLE_ALIGNMENT=false
      - ENABLE_DIARIZATION=true
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./models/whisper-tn-ct2:/models/whisper-tn-ct2:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Requires the NVIDIA Container Toolkit installed on the host
    # (nvidia-ctk runtime configure) so the container can see the GPU at all.
    restart: unless-stopped
